<style>
:root{
  --bg:#0b0d10; --bg2:#12161b; --panel:rgba(15,18,23,.9);
  --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.06);
  --txt:#f4f1ea; --dim:#98a0aa; --dim2:#7b8490;
  --accent:#f5c76e; --accent2:#ff9ecd;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none}
#map{position:absolute;inset:0;background:#0b0d10;z-index:1}
.leaflet-container{background:#0b0d10;font:inherit;outline:none}
.leaflet-tile{filter:brightness(1.22) contrast(1.03)}
.leaflet-control-attribution{background:rgba(11,13,16,.72)!important;color:#6b7480!important;
  font-size:9px!important;padding:2px 6px!important;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:#8b939d!important}

/* ── header ─────────────────────────────────────── */
.brand{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;z-index:800;
  pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.9)}
.brand h1{margin:0;font-family:ui-serif,Georgia,"Times New Roman",serif;
  font-size:26px;line-height:1;letter-spacing:.06em;font-weight:500}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand p{margin:6px 0 0;font-size:11.5px;color:var(--dim);letter-spacing:.13em;
  text-transform:uppercase;font-weight:600}

/* map controls */
.ctrls{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:800;
  display:flex;flex-direction:column;gap:6px}
.ctrls button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:rgba(18,22,27,.86);color:var(--txt);font-size:16px;line-height:1;cursor:pointer;
  backdrop-filter:blur(10px);display:grid;place-items:center;transition:.15s}
.ctrls button:hover{border-color:rgba(245,199,110,.5);color:var(--accent)}
.ctrls button:active{transform:scale(.94)}

/* ── sidebar ────────────────────────────────────── */
.panel{position:absolute;top:0;left:0;bottom:0;width:352px;z-index:700;
  display:flex;flex-direction:column;gap:12px;padding:98px 16px 14px;
  background:linear-gradient(180deg,rgba(11,13,16,.96) 0%,rgba(11,13,16,.9) 62%,rgba(11,13,16,.72) 100%);
  border-right:1px solid var(--line2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.search{position:relative;flex:0 0 auto}
.search input{width:100%;padding:11px 14px 11px 36px;border-radius:12px;
  background:rgba(255,255,255,.055);border:1px solid var(--line);color:var(--txt);
  font-size:14px;outline:none;transition:.18s}
.search input:focus{border-color:rgba(245,199,110,.55);background:rgba(255,255,255,.08)}
.search input::placeholder{color:var(--dim2)}
.search svg{position:absolute;left:12px;top:12px;width:15px;height:15px;opacity:.5}
.seg{display:flex;gap:6px;flex:0 0 auto}
.seg button{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.03em;
  cursor:pointer;transition:.15s}
.seg button.on{background:var(--txt);color:#0b0d10;border-color:var(--txt)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:0 0 auto;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);
  font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:99px;background:currentColor}
.chip.on{color:var(--txt);border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1)}
.chip.off{opacity:.32}
.chip .n{color:var(--dim2);font-variant-numeric:tabular-nums}
.selwrap{position:relative;flex:0 0 auto}
.selwrap select{width:100%;appearance:none;-webkit-appearance:none;padding:9px 30px 9px 12px;
  border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--txt);font-size:12.5px;font-weight:600;outline:none;cursor:pointer}
.selwrap select:focus{border-color:rgba(245,199,110,.5)}
.selwrap select option{background:#141920;color:#eee}
.selwrap::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--dim2);font-size:11px;pointer-events:none}
.listshell{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.listhead{display:flex;justify-content:space-between;align-items:baseline;
  padding:0 2px 6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);font-weight:700}
.listhead b{color:var(--dim);font-variant-numeric:tabular-nums}
.list{overflow-y:auto;flex:1 1 auto;margin:0 -6px;padding:0 6px 30px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:11px;
  cursor:pointer;border:1px solid transparent;transition:.12s}
.row:hover{background:rgba(255,255,255,.055);border-color:var(--line2)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .pin{width:9px;height:9px;border-radius:99px;margin-top:5px;flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.row .txt{min-width:0;flex:1}
.row .nm{font-size:13.5px;font-weight:600;line-height:1.25;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row .mt{font-size:11px;color:var(--dim2);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row .q{font-size:10.5px;color:#8e949c;font-style:italic;margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row .pen{color:var(--accent);font-size:10px;margin-left:4px;opacity:.85}
.row .rt{font-size:11px;font-weight:700;color:var(--accent);flex:0 0 auto;margin-top:1px;
  font-variant-numeric:tabular-nums}
.row.gone .nm{text-decoration:line-through;color:var(--dim2)}
.row.gone .pin{opacity:.35}
.empty{color:var(--dim2);font-size:13px;padding:26px 8px;text-align:center;line-height:1.6}
.foot{flex:0 0 auto;font-size:10px;color:var(--dim2);line-height:1.5;padding-top:2px}
.foot a{color:var(--dim)}

/* ── map ui ─────────────────────────────────────── */
.fab{position:absolute;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:600;
  width:52px;height:52px;border-radius:99px;border:1px solid rgba(255,255,255,.16);
  background:linear-gradient(160deg,#232830,#12161b);color:var(--accent);font-size:21px;
  cursor:pointer;box-shadow:0 10px 34px rgba(0,0,0,.55);transition:.16s;display:grid;place-items:center}
.fab:hover{transform:translateY(-2px);border-color:rgba(245,199,110,.5)}
.fab:active{transform:scale(.95)}
.toast{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  z-index:800;background:rgba(20,24,30,.96);border:1px solid var(--line);border-radius:12px;
  padding:9px 15px;font-size:12.5px;color:var(--txt);opacity:0;pointer-events:none;
  transition:.25s;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* zone bubbles */
.zbub{background:transparent;border:none}
.zbub div{display:grid;place-items:center;border-radius:99px;
  background:rgba(245,199,110,.13);border:1px solid rgba(245,199,110,.5);
  color:#f7e3b4;font-weight:700;text-shadow:0 1px 6px #000;
  backdrop-filter:blur(2px);transition:.15s}
.zbub:hover div{background:rgba(245,199,110,.26);transform:scale(1.06)}

.ctrls button.loc svg{width:17px;height:17px}
.ctrls button.loc.busy{color:var(--accent);animation:pulsebtn 1.1s ease-in-out infinite}
@keyframes pulsebtn{0%,100%{opacity:.45}50%{opacity:1}}
.me{background:transparent;border:none}
.me .dot{width:16px;height:16px;border-radius:99px;background:#4ea8de;border:3px solid #fff;
  box-shadow:0 0 0 6px rgba(78,168,222,.22),0 4px 16px rgba(0,0,0,.7);position:relative}
.me .dot::after{content:"";position:absolute;inset:-9px;border-radius:99px;border:1px solid rgba(78,168,222,.65);
  animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}

/* clusters */
.clwrap{background:transparent;border:none}
.cl{display:grid;place-items:center;border-radius:99px;font-weight:800;color:#fff;
  background:rgba(17,21,26,.9);border:2px solid var(--c);letter-spacing:-.02em;
  box-shadow:0 0 0 5px rgba(0,0,0,.22),0 8px 24px rgba(0,0,0,.5);
  backdrop-filter:blur(3px);transition:transform .15s}
.clwrap:hover .cl{transform:scale(1.07)}
.ctt{background:#141920!important;color:#e9e5dd!important;border:1px solid rgba(255,255,255,.14)!important;
  border-radius:9px!important;font-size:11px!important;padding:5px 9px!important;box-shadow:0 8px 24px rgba(0,0,0,.5)!important}
.ctt::before{display:none}

/* markers */
.mk{background:transparent;border:none}
.mk i{display:block;border-radius:99px;transition:transform .15s,box-shadow .15s;
  box-shadow:0 0 0 1.5px rgba(0,0,0,.6),0 0 12px 1px currentColor,0 2px 8px rgba(0,0,0,.55)}
.mk.been i{box-shadow:0 0 0 2px #fff,0 2px 10px rgba(0,0,0,.6)}
.mk.closed i{filter:grayscale(1);opacity:.5}
.mk:hover i{transform:scale(1.45)}
.mk.sel i{transform:scale(1.7);box-shadow:0 0 0 2.5px #fff,0 0 18px rgba(245,199,110,.9)}

.mecard h3{margin-top:4px}
.nearlist{margin-top:9px;display:flex;flex-direction:column;gap:2px}
.nearrow{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:9px;cursor:pointer}
.nearrow:hover{background:rgba(255,255,255,.06)}
.nr-i{width:17px;height:17px;border-radius:99px;background:rgba(78,168,222,.18);color:#8ecbf0;
  font-size:9.5px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.nr-n{flex:1;min-width:0;font-size:12.5px;font-weight:600;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nr-n em{display:block;font-style:normal;font-size:10px;color:var(--dim2);font-weight:500;margin-top:1px}
.nr-d{font-size:11px;font-weight:700;color:#8ecbf0;flex:0 0 auto;font-variant-numeric:tabular-nums}

/* ── popup ───────────────────────────────────────── */
.leaflet-fade-anim .leaflet-popup{opacity:1!important}
.leaflet-popup-content-wrapper{background:#141920;color:var(--txt);border-radius:15px;
  border:1px solid rgba(255,255,255,.13);box-shadow:0 22px 60px rgba(0,0,0,.72);padding:0}
.leaflet-popup-content{margin:0;width:266px!important;line-height:1.45}
.leaflet-popup-tip{background:#141920;border:1px solid rgba(255,255,255,.13)}
.leaflet-popup-close-button{color:#7c8590!important;font-size:19px!important;padding:9px 10px 0 0!important}
.leaflet-popup-close-button:hover{color:#fff!important}
.pp{padding:15px 16px 13px}
.pp .kicker{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;
  color:var(--dim2);display:flex;justify-content:space-between;gap:8px;align-items:center;
  padding-right:16px}
.pp .kicker .p{color:var(--accent);letter-spacing:.05em}
.pp h3{margin:6px 0 2px;font-size:17px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.pp .sub{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pp .star{color:var(--accent);font-weight:700}
.pp .note{margin:9px 0 0;font-size:12px;color:#c9cfd6;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.ynote{margin:10px 0 0;padding:8px 10px;border-left:2px solid var(--accent);
  background:rgba(245,199,110,.07);border-radius:0 8px 8px 0}
.ynote .ynlab{font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:800;color:var(--accent);margin-bottom:4px}
.ynote p{margin:0;font-size:11.5px;line-height:1.5;color:#dcd8cf;font-style:italic;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.pp .hr{height:1px;background:var(--line2);margin:11px 0 9px}
.pp .meta{font-size:10.5px;color:var(--dim2);line-height:1.6}
.pp .meta b{color:var(--dim);font-weight:600}
.pp .meta a.tel{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:7px;
  background:rgba(245,199,110,.12);color:var(--accent);text-decoration:none;font-weight:700;letter-spacing:.02em}
.pp .badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:9px;
  letter-spacing:.09em;text-transform:uppercase;font-weight:800;vertical-align:1px}
.b-been{background:rgba(255,255,255,.16);color:#fff}
.b-want{background:rgba(245,199,110,.16);color:var(--accent)}
.b-gone{background:rgba(255,90,90,.16);color:#ff8f8f}
.pp .go{display:flex;align-items:center;justify-content:space-between;margin-top:10px;
  text-decoration:none;color:#0b0d10;background:var(--accent);border-radius:9px;
  padding:8px 11px;font-size:11.5px;font-weight:800;letter-spacing:.02em}
.pp .go:active{opacity:.8}

/* mobile */
.sheetbtn{display:none}
@media (max-width:820px){
  .leaflet-bottom.leaflet-right{bottom:180px;right:auto;left:10px}
  .leaflet-control-attribution{border-radius:8px!important;background:rgba(11,13,16,.6)!important}
  .brand{top:calc(10px + env(safe-area-inset-top));left:14px}
  .ctrls button{width:44px;height:44px;font-size:17px}
  .seg button{padding:10px 4px}
  .chip{padding:8px 11px}
  .brand h1{font-size:21px}
  .brand p{font-size:9.5px;letter-spacing:.11em;margin-top:4px}
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:auto;max-height:66vh;
    backdrop-filter:none;-webkit-backdrop-filter:none;
    padding:0 12px calc(10px + env(safe-area-inset-bottom));border-right:none;
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    background:rgba(13,16,20,.97);transform:translateY(calc(100% - 174px));
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -18px 50px rgba(0,0,0,.6)}
  .panel.open{transform:translateY(0)}
  .grab{height:26px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;margin:0 -12px 6px}
  .grab span{width:40px;height:4px;border-radius:9px;background:rgba(255,255,255,.22)}
  .panel .chips.areas{display:none}
  .panel.open .chips.areas{display:flex}
  .list{padding-bottom:6px}
  .foot{display:none}
  .fab{width:47px;height:47px;right:14px;bottom:calc(160px + env(safe-area-inset-bottom));font-size:19px}
  .toast{bottom:calc(300px + env(safe-area-inset-bottom))}
  .leaflet-popup-content{margin:0;width:238px!important}
  .pp{padding:13px 14px 12px}
  .pp h3{font-size:15.5px}
}
@media (max-width:820px) and (max-height:560px){
  .panel{max-height:82vh}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="brand">
  <h1>Bombay <em>Eats</em></h1>
  <p id="tagline">— Tushar's list</p>
</div>

<div class="ctrls">
  <button id="locbtn" class="loc" aria-label="Centre on my location" title="Find me">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="8.2" opacity=".55"/>
      <path d="M12 1.6v3.1M12 19.3v3.1M1.6 12h3.1M19.3 12h3.1"/>
    </svg>
  </button>
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="allbtn" aria-label="Whole city">⤢</button>
</div>

<aside class="panel" id="panel">
  <div class="grab" id="grab"><span></span></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search place, area or dish…" autocomplete="off" spellcheck="false">
  </div>
  <div class="seg" id="seg">
    <button data-b="all" class="on">All</button>
    <button data-b="pending">Want to go</button>
    <button data-b="visited">Been</button>
  </div>
  <div class="chips" id="cats"></div>
  <div class="selwrap"><select id="areasel"><option value="">All areas</option></select></div>
  <div class="listshell">
    <div class="listhead"><span id="lhead">Places</span><b id="lcount">0</b></div>
    <div class="list" id="list"></div>
  </div>
  <div class="foot">136 hand-kept spots · status &amp; hours from Google Places, Nov 2026.<br>
    Built for sharing — tap a pin, or hit the dice.</div>
</aside>

<button class="fab" id="rand" title="Pick for me" aria-label="Pick a random place">🎲</button>
<div class="toast" id="toast"></div>

const CAT_COLOR = {
  "Pizza":"#ff7a59","Indian":"#ffca3a","South Indian":"#a8e063","Asian":"#4ecdc4",
  "Coastal":"#4ea8de","Middle Eastern":"#b388ff","Cafe / Bakery":"#ff9ecd",
  "Continental":"#9aa5ff","Burgers":"#e07a5f","Mexican":"#ffd166","Bar":"#8d99ae","Other":"#8d99ae"
};
const color = c => CAT_COLOR[c] || "#8d99ae";
const $ = s => document.querySelector(s);

/* ── map ───────────────────────────────────────── */
const map = L.map("map", {
  zoomControl:false, attributionControl:true, preferCanvas:true,
  minZoom:10, maxZoom:18, zoomSnap:.5, worldCopyJump:true
}).setView([19.045,72.86],12);

L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{
  maxNativeZoom:16, maxZoom:19,
  attribution:'Tiles &copy; Esri &middot; HERE, Garmin &middot; &copy; OpenStreetMap contributors'
}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{
  maxNativeZoom:16, maxZoom:19, opacity:.85
}).addTo(map);

/* pin/dot layers */
const layerAll = L.layerGroup().addTo(map);
const markers = new Map();
const GRID = innerWidth<=820 ? 50 : 46;               /* px cell used for collision clustering */

function dotIcon(p){
  const base = innerWidth<=820 ? 15 : 11;
  const s = Math.round(base + Math.max(0, ((p.r||4)-3.5))*2);
  return L.divIcon({
    className:"mk"+(p.b==="visited"?" been":"")+(p.s!=="open"?" closed":""),
    html:`<i style="width:${s}px;height:${s}px;background:${color(p.c)};color:${color(p.c)}"></i>`,
    iconSize:[s,s], iconAnchor:[s/2,s/2], popupAnchor:[0,-s/2-2]
  });
}
function clusterIcon(items){
  const n = items.length;
  const s = Math.round(Math.min(innerWidth<=820?44:46, 22 + Math.sqrt(n)*5));
  const counts = {};
  items.forEach(p=>counts[p.c]=(counts[p.c]||0)+1);
  const col = color(Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0]);
  const fs = n>99 ? 12 : s>44 ? 14 : 12;
  return L.divIcon({
    className:"clwrap",
    html:`<div class="cl" style="--c:${col};width:${s}px;height:${s}px;font-size:${fs}px">${n}</div>`,
    iconSize:[s,s], iconAnchor:[s/2,s/2]
  });
}

function popupHTML(p){
  const st = p.s==="closed_perm" ? '<span class="badge b-gone">Closed</span>'
           : p.s==="closed_temp" ? '<span class="badge b-gone">Shut for now</span>'
           : p.b==="visited" ? '<span class="badge b-been">Been</span>'
           : '<span class="badge b-want">To try</span>';
  const stars = p.r ? `<span class="star">★ ${p.r}</span>${p.v?` <span style="opacity:.55">(${p.v.toLocaleString()})</span>`:""}` : "";
  const hrs = todayHours(p.h);
  return `<div class="pp">
    <div class="kicker"><span>${esc(p.c)}</span><span class="p">${esc(p.p||"")}</span></div>
    <h3>${esc(p.n)}</h3>
    <div class="sub">${st} <span>${esc(p.a)}</span> ${stars}</div>
    ${p.rev
      ? `<div class="ynote"><div class="ynlab">${p.b==="visited"?"Your note":"Note"}${p.revY?` \u00b7 ${esc(p.revY)}`:""}</div><p>${esc(p.rev)}</p></div>`
      : (p.d?`<p class="note">${esc(p.d)}</p>`:"")}
    <div class="hr"></div>
    <div class="meta">${p.k?`<b>${esc(p.k)}</b><br>`:""}${hrs?`<span style="color:${hrs.closed?'#ff8f8f':'#9aa1a9'}">${esc(hrs.txt)}</span><br>`:""}${p.addr?esc(p.addr):""}${p.ph?`<br><a class="tel" href="tel:${(()=>{const d=String(p.ph).replace(/\D/g,"");return d.length===11&&d[0]==="0"?"+91"+d.slice(1):d.length===10?"+91"+d:"+"+d})()}">${esc(p.ph)}</a>`:""}</div>
    ${p.u?`<a class="go" href="${esc(p.u)}" target="_blank" rel="noopener"><span>Open in Google Maps</span><span>↗</span></a>`:""}
  </div>`;
}
const esc = s => String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function todayHours(h){
  if(!h) return null;
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const d = (()=>{ try{return new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Kolkata",weekday:"long"}).format(new Date());}
                   catch(e){return days[new Date().getDay()];} })();
  const v = h[d];
  if(!v) return null;
  if(/closed/i.test(v)) return {txt:"Closed today",closed:true};
  return {txt:`Today · ${v}`,closed:false};
}

/* ── state ─────────────────────────────────────── */
const state = {q:"", bucket:"all", cats:new Set(), zone:""};
let filtered = PLACES.slice();
let selected = null;

/* ── build controls ────────────────────────────── */
const catCounts = {};
PLACES.forEach(p=>catCounts[p.c]=(catCounts[p.c]||0)+1);
const catBox = $("#cats");
Object.keys(catCounts).sort((a,b)=>catCounts[b]-catCounts[a]).forEach(c=>{
  const b = document.createElement("button");
  b.className="chip off"; b.dataset.cat=c;
  b.innerHTML=`<span class="dot" style="color:${color(c)}"></span>${esc(c)} <span class="n">${catCounts[c]}</span>`;
  b.onclick=()=>{
    if(state.cats.has(c)) state.cats.delete(c); else state.cats.add(c);
    refresh();
  };
  catBox.appendChild(b);
});

const zones = {};
PLACES.forEach(p=>zones[p.z]=(zones[p.z]||0)+1);
const areaSel = $("#areasel");
Object.keys(zones).sort((a,b)=>zones[b]-zones[a]).forEach(z=>{
  const o=document.createElement("option");
  o.value=z; o.textContent=`${z}  (${zones[z]})`;
  areaSel.appendChild(o);
});
areaSel.onchange=()=>{
  state.zone = areaSel.value;
  refresh();
  if(state.zone){
    const pts=PLACES.filter(p=>p.z===state.zone);
    const bb=L.latLngBounds(pts.map(p=>[p.lat,p.lng]));
    const pad = innerWidth<=820 ? {paddingTopLeft:[30,90],paddingBottomRight:[30,220],maxZoom:15}
                                : {paddingTopLeft:[400,90],paddingBottomRight:[70,70],maxZoom:15};
    map.flyToBounds(bb,{...pad,duration:.7});
  }
};

$("#seg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  state.bucket=b.dataset.b;
  [...$("#seg").children].forEach(x=>x.classList.toggle("on",x===b));
  refresh();
});
$("#q").addEventListener("input",e=>{state.q=e.target.value.toLowerCase().trim();refresh();});

/* mobile sheet */
const panel=$("#panel");
$("#grab").onclick=()=>panel.classList.toggle("open");
$("#q").addEventListener("focus",()=>{ if(innerWidth<=820) panel.classList.add("open"); });

/* ── filtering & render ────────────────────────── */
const zoneCount={}; PLACES.forEach(p=>zoneCount[p.z]=(zoneCount[p.z]||0)+1);
const zoneRank={}; Object.keys(zoneCount).sort((a,b)=>zoneCount[b]-zoneCount[a]).forEach((z,i)=>zoneRank[z]=i);
const score = p => (p.s!=="open" ? -100 : 0) + (p.r||0) * Math.log10(Math.max(p.v||1,10));
const sortKey = p => (99-zoneRank[p.z])*100 + score(p);

const HAY=new Map(PLACES.map(p=>[p,(p.n+" "+p.a+" "+p.z+" "+p.k+" "+p.c+" "+(p.d||"")).toLowerCase()]));
function matches(p){
  if(state.bucket!=="all" && p.b!==state.bucket) return false;
  if(state.cats.size && !state.cats.has(p.c)) return false;
  if(state.zone && p.z!==state.zone) return false;
  if(state.q && !HAY.get(p).includes(state.q)) return false;
  return true;
}

function refresh(){
  [...catBox.children].forEach(b=>{
    const on=state.cats.has(b.dataset.cat);
    b.classList.toggle("on",on); b.classList.toggle("off",!on && state.cats.size>0);
  });
  areaSel.value = state.zone;

  filtered = PLACES.filter(matches).sort((a,b)=>sortKey(b)-sortKey(a));

  /* sidebar list */
  const list=$("#list");
  list.innerHTML = filtered.length ? filtered.map(p=>`
    <div class="row ${p.s!=="open"?"gone":""}" data-k="${esc(p.n)}" role="button" tabindex="0">
      <span class="pin" style="background:${color(p.c)}"></span>
      <div class="txt">
        <div class="nm">${esc(p.n)}${p.rev?'<span class="pen">✎</span>':""}</div>
        <div class="mt">${esc(p.a)} · ${esc(p.c)}${p.s!=="open"?" · closed":""}</div>
        ${(p.rev||p.d) && p.b==="visited"?`<div class="q">${esc((p.rev||p.d).slice(0,90))}</div>`:""}
      </div>
      <div class="rt">${p.r?p.r.toFixed(1):""}</div>
    </div>`).join("")
    : `<div class="empty">Nothing matches.<br>Try clearing a filter.</div>`;
  $("#lcount").textContent = filtered.length;
  $("#lhead").textContent = state.bucket==="visited"?"Been" : state.bucket==="pending"?"To try" : "Places";

  list.querySelectorAll(".row").forEach(r=>{
    r.onclick=()=>focusPlace(r.dataset.k);
    r.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); focusPlace(r.dataset.k); } };
  });

  renderMarkers();
}

function renderMarkers(){
  layerAll.clearLayers(); markers.clear();
  const z = map.getZoom(), cells = {};
  filtered.forEach(p=>{
    const pt = map.project([p.lat,p.lng], z);
    const k = Math.floor(pt.x/GRID)+":"+Math.floor(pt.y/GRID);
    (cells[k] = cells[k] || []).push(p);
  });
  Object.values(cells).forEach(items=>{
    if(items.length===1){
      const p=items[0];
      const m=L.marker([p.lat,p.lng],{icon:dotIcon(p),keyboard:false,riseOnHover:true});
      m.bindPopup(popupHTML(p),{closeButton:true,maxWidth:300,minWidth:250,autoPanPadding:[26,26]});
      m.on("click",()=>select(p.n));
      m.addTo(layerAll);
      if(p.n===selected) m.getElement()?.classList.add("sel");
      markers.set(p.n,m);
      return;
    }
    const lat = items.reduce((s,p)=>s+p.lat,0)/items.length;
    const lng = items.reduce((s,p)=>s+p.lng,0)/items.length;
    const names = items.slice().sort((a,b)=>score(b)-score(a)).map(p=>p.n);
    const m=L.marker([lat,lng],{icon:clusterIcon(items),keyboard:false});
    m.bindTooltip(names.slice(0,4).join(" · ")+(names.length>4?` +${names.length-4}`:""),
      {direction:"top",offset:[0,-14],className:"ctt"});
    m.on("click",()=>{
      const b=L.latLngBounds(items.map(p=>[p.lat,p.lng]));
      map.flyToBounds(b,{padding:[90,90],maxZoom:Math.min(17,z+3),duration:.6});
    });
    m.addTo(layerAll);
  });
}
map.on("zoomend",renderMarkers);
map.on("resize",renderMarkers);

/* ── selection ─────────────────────────────────── */
function select(name){
  if(selected && markers.get(selected)) markers.get(selected).getElement()?.classList.remove("sel");
  selected=name;
  const el=markers.get(name)?.getElement();
  if(el) el.classList.add("sel");
}
function openAt(p){
  L.popup({closeButton:true,maxWidth:300,minWidth:250,autoPanPadding:[26,26]})
    .setLatLng([p.lat,p.lng]).setContent(popupHTML(p)).openOn(map);
  select(p.n);
}
function focusPlace(name){
  const p=PLACES.find(x=>x.n===name); if(!p) return;
  if(innerWidth<=820) panel.classList.remove("open");
  const far = map.getZoom()<15;
  if(far){
    map.once("moveend",()=>openAt(p));
    map.flyTo([p.lat,p.lng],16,{duration:.7});
  }else{
    map.panTo([p.lat,p.lng],{animate:true,duration:.45});
    setTimeout(()=>openAt(p),320);
  }
}

/* ── my location ───────────────────────────────── */
let meLayer=null, meMarker=null;
function haversine(a,b){
  const R=6371, p1=a[0]*Math.PI/180, p2=b[0]*Math.PI/180;
  const dp=p2-p1, dl=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const fmtKm = d => d<1 ? Math.max(50,Math.round(d*1000/10)*10)+" m" : d.toFixed(1)+" km";
function nearest(ll,n=4){
  return PLACES.filter(p=>p.s==="open")
    .map(p=>({p,d:haversine(ll,[p.lat,p.lng])}))
    .sort((a,b)=>a.d-b.d).slice(0,n);
}
function mePopup(ll){
  const near=nearest(ll);
  const rows=near.map((x,i)=>`<div class="nearrow" data-k="${esc(x.p.n)}">
      <span class="nr-i">${i+1}</span>
      <span class="nr-n">${esc(x.p.n)}<em>${esc(x.p.a)} · ${esc(x.p.c)}</em></span>
      <span class="nr-d">${fmtKm(x.d)}</span></div>`).join("");
  return `<div class="pp mecard">
    <div class="kicker"><span>You are here</span><span class="p">${near.length?fmtKm(near[0].d)+" to food":""}</span></div>
    <h3>Closest on the list</h3>
    <div class="nearlist">${rows}</div></div>`;
}
function locateOk(pos){
  const btn=$("#locbtn"); btn.classList.remove("busy");
  const ll=[pos.coords.latitude,pos.coords.longitude], acc=Math.max(pos.coords.accuracy||0,30);
  if(meLayer) map.removeLayer(meLayer);
  meLayer = L.layerGroup().addTo(map);
  L.circle(ll,{radius:acc,color:"#4ea8de",weight:1,opacity:.45,fillColor:"#4ea8de",fillOpacity:.1}).addTo(meLayer);
  meMarker = L.marker(ll,{icon:L.divIcon({className:"me",html:'<div class="dot"></div>',
      iconSize:[16,16],iconAnchor:[8,8],popupAnchor:[0,-13]}),zIndexOffset:1200});
  meMarker.bindPopup(mePopup(ll),{closeButton:true,maxWidth:300,minWidth:250,autoPanPadding:[26,26]});
  meMarker.on("popupopen",()=>{
    document.querySelectorAll(".nearrow").forEach(r=>r.onclick=()=>focusPlace(r.dataset.k));
  });
  meMarker.addTo(meLayer);
  const d0 = nearest(ll,1)[0];
  if(d0 && d0.d > 25){
    toast(`You're ${Math.round(d0.d)} km from the nearest pick on this list`);
    return;
  }
  map.once("moveend",()=>{ if(meMarker) meMarker.openPopup(); });
  map.flyTo(ll,15,{duration:.9});
}
function locateFail(err){
  $("#locbtn").classList.remove("busy");
  toast(err && err.code===1 ? "Location permission denied"
      : err && err.code===3 ? "Location timed out — try again"
      : "Couldn't get your location here");
}
$("#locbtn").onclick=()=>{
  if(!navigator.geolocation){ toast("This browser can't share location"); return; }
  $("#locbtn").classList.add("busy");
  navigator.geolocation.getCurrentPosition(locateOk, locateFail,
    {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
};

/* ── dice ──────────────────────────────────────── */
$("#rand").onclick=()=>{
  const pool=filtered.filter(p=>p.s==="open");
  if(!pool.length){ toast("No open spots in this filter"); return; }
  const p=pool[Math.floor(Math.random()*pool.length)];
  toast("🎲 "+p.n+" — "+p.a);
  map.flyTo([p.lat,p.lng],15.5,{duration:.9});
  setTimeout(()=>openAt(p),1000);
};
let tt;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),3200);
}

/* ── boot ──────────────────────────────────────── */
function homeView(){
  /* Bandra–Khar houses 74 of the 136 places — open where the density is */
  const c=L.latLng(19.0605,72.8300);
  const z = innerWidth<=820 ? 13.2 : 13.55;
  const p = map.project(c,z);
  const dx = innerWidth<=820 ? 0 : 150;      /* clear the sidebar */
  const dy = innerWidth<=820 ? 120 : 10;     /* clear the bottom sheet */
  map.setView(map.unproject(L.point(p.x-dx, p.y+dy), z), z, {animate:false});
}
function fitAll(){
  const b=L.latLngBounds(PLACES.map(p=>[p.lat,p.lng]));
  if(innerWidth<=820) map.fitBounds(b,{paddingTopLeft:[26,80],paddingBottomRight:[26,150],maxZoom:12.5});
  else map.fitBounds(b,{paddingTopLeft:[396,70],paddingBottomRight:[60,60],maxZoom:12.5});
}
$("#allbtn").onclick=()=>{
  state.zone=""; state.cats.clear(); state.q=""; state.bucket="all";
  $("#q").value=""; areaSel.value="";
  [...$("#seg").children].forEach(b=>b.classList.toggle("on", b.dataset.b==="all"));
  refresh(); fitAll();
};
$("#zin").onclick=()=>map.zoomIn();
$("#zout").onclick=()=>map.zoomOut();
$("#tagline").textContent = `${PLACES.length} places · ${PLACES.filter(p=>p.b==="visited").length} eaten`;
homeView();
refresh();
let lastW=innerWidth;
map.on("resize",()=>{ if(Math.abs(innerWidth-lastW)>120){ lastW=innerWidth; homeView(); } });
if(innerWidth<=820){ setTimeout(()=>toast("Tap 🎲 for a random pick"),1600); }
</script>
